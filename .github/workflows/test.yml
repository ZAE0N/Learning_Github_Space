name Test

on
  push
    branches [main]
  pull_request
    branches [main]
  workflow_dispatch

jobs
  test
    runs-on ubuntu-latest

    steps
      - name 코드 내려받기
        uses actionscheckout@v4

      - name Python 설치
        uses actionssetup-python@v5
        with
          python-version '3.11'

      - name 의존성 설치
        run pip install -r requirements.txt

      - name 테스트 실행
        run pytest -v